      #  config:
      #    stateTransformation:
      #      - JSONPATH($..heatPumpStatus)
      #    mode: READONLY
      supplyTemperature:
        type: number
        label: Supply Temperature
        config:
          stateTransformation:
            - "JSONPATH($..supplyTemperature)"
          mode: READONLY
