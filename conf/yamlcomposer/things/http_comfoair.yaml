version: 1

things:
  http:url:comfoairq:
    label: ComfoAirQ
    config:
      baseURL: http://${ENV.CUSTOM_COMFO_CLIME_IP}
      delay: 1000
      refresh: 60
      commandMethod: PUT
    channels:
      # *** ComfoAirQ Telemetrie ***
      exhaustFanSpeed:
        type: number
        label: Exhaust Fan Speed
        config:
          stateTransformation: "JSONPATH($..data[0])"
          stateExtension: /device/${ENV.CUSTOM_COMFO_AIR_UID}/telemetry/117
          mode: READONLY
      supplyFanSpeed:
        type: number
        label: Supply Fan Speed
        config:
          stateTransformation: "JSONPATH($..data[0])"
          stateExtension: /device/${ENV.CUSTOM_COMFO_AIR_UID}/telemetry/118
          mode: READONLY
      bypassState:
        type: number
        label: Bypass State
        config:
          stateTransformation: "JSONPATH($..data[0])"
          stateExtension: /device/${ENV.CUSTOM_COMFO_AIR_UID}/telemetry/227
          mode: READONLY
      # *** ComfoClime Thermal ***
      season:
        type: number
        label: Season
        config:
          stateTransformation: "JSONPATH($..season.season)"
          commandTransformation: "PY(|'{\"season\": {\"season\":' + str(input) + '}}')"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/thermalprofile
          mode: READWRITE
      # *** ComfoClime Telemetrie ***
      tpmaTemperature:
        type: number
        label: TPMA Temperature
        config:
          stateTransformation: "JSONPATH($..data[0])∩PY(|int(input)/10.0)"
          stateExtension: /device/${ENV.CUSTOM_COMFO_CLIME_UID}/telemetry/4145
          mode: READONLY
      heatpumpPower:
        type: number
        label: Headpump Power
        config:
          stateTransformation: "JSONPATH($..data[0])"
          stateExtension: /device/${ENV.CUSTOM_COMFO_CLIME_UID}/telemetry/4198
          mode: READONLY
      # *** ComfoClime Dashboard ***
      #indoorTemperature:
      #  type: number
      #  label: Indoor Temperature
      #  config:
      #    stateTransformation:
      #      - "JSONPATH($..indoorTemperature)"
      #    mode: READONLY
      #outdoorTemperature:
      #  type: number
      #  label: Outdoor Temperature
      #  config:
      #    stateTransformation:
      #      - "JSONPATH($..outdoorTemperature)"
      #    mode: READONLY
      exhaustAirFlow:
        type: number
        label: Abfluft Volumenstrom
        config:
          stateTransformation: "JSONPATH($..exhaustAirFlow)"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          mode: READONLY
      supplyAirFlow:
        type: number
        label: Zuluft Volumenstrom
        config:
          stateTransformation: "JSONPATH($..supplyAirFlow)"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          mode: READONLY
      #fanSpeed:
      #  type: number
      #  label: Fan Speed
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..fanSpeed)
      #    mode: READONLY
      setPointTemperature:
        type: number
        label: Target Temperature
        config:
          stateTransformation: "JSONPATH($..setPointTemperature)"
          commandTransformation: "PY(|'{\"setPointTemperature\":' + str(input) + '}')"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          mode: READWRITE
      #season:
      #  type: number
      #  label: Season
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..season)
      #    mode: READONLY
      #schedule:
      #  type: number
      #  label: Schedule
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..schedule)
      #    mode: READONLY
      #status:
      #  type: number
      #  label: Status
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..status)
      #    mode: READONLY
      heatPumpStatus:
        type: number
        label: Heatpump Status
        config:
          stateTransformation: "JSONPATH($..heatPumpStatus)"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          mode: READONLY
      climePower:
        type: switch
        label: Power
        config:
          stateTransformation: "JSONPATH($..hpStandby)"
          commandTransformation: "PY(|'{\"hpStandby\":' + str(input) + '}')"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          onValue: "false"
          offValue: "true"
          mode: READWRITE
      climeReset:
        type: switch
        label: Reset
        config:
          commandTransformation: ""
          stateExtension: /system/reset
          onValue: "false"
          offValue: "true"
          mode: WRITEONLY
      freeCoolingEnabled:
        type: switch
        label: Free Cooling Enabled
        config:
          stateTransformation: "JSONPATH($..freeCoolingEnabled)"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          onValue: "true"
          offValue: "false"
          mode: READONLY
      caqFreeCoolingAvailable:
        type: switch
        label: Caq Free Cooling Available
        config:
          stateTransformation: "JSONPATH($..caqFreeCoolingAvailable)"
          stateExtension: /system/${ENV.CUSTOM_COMFO_CLIME_UID}/dashboard
          onValue: "true"
          offValue: "false"
          mode: READONLY
      # *** ComfoClime Dashboard ***
      #setPointTemperature:
      #  type: number
      #  label: Target Temperature
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..setPointTemperature)
      #    mode: READONLY
      #status:
      #  type: number
      #  label: Status
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..status)
      #    mode: READONLY
      #heatPumpStatus:
      #  type: number
      #  label: Heatpump Status
      #  config:
      #    stateTransformation:
      #      - JSONPATH($..heatPumpStatus)
      #    mode: READONLY
      supplyTemperature:
        type: number
        label: Supply Temperature
        config:
          stateTransformation: "JSONPATH($..supplyTemperature)"
          stateExtension: /device/${ENV.CUSTOM_COMFO_CLIME_UID}/definition
          mode: READONLY

