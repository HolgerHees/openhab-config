version: 1

things:
  gardena:account:default:
    isBridge: true
    label: Bodenfeuchte Gardena Smart System API
    config:
      apiSecret: ${ENV.CUSTOM_GARDENA_SECRET}
      apiKey: ${ENV.CUSTOM_GARDENA_KEY}

  gardena:sensor:default:sensor1:
    bridge: gardena:account:default
    label: Bodenfeuchte Sensor 1
    config:
      deviceId: ${ENV.CUSTOM_GARDENA_SENSOR1_ID}

  gardena:sensor:default:sensor2:
    bridge: gardena:account:default
    label: Bodenfeuchte Sensor 2
    config:
      deviceId: ${ENV.CUSTOM_GARDENA_SENSOR2_ID}

  gardena:sensor:default:sensor3:
