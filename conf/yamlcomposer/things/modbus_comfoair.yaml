  #  bridge: modbus:poller:ventilation:input
  #  label: ComfoAirQ room humidity
  #  config:
  #    readStart: "12"
  #    readValueType: int16

  modbus:data:ventilation:input:comfoairq_h_indoor_out:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ indoor out humidity
    config:
      readStart: "13"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_h_outdoor_out:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ outdoor out humidity
    config:
      readStart: "14"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_h_outdoor_in:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ outdoor in humidity
    config:
      readStart: "15"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_h_indoor_in:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ indoor in humidity
    config:
      readStart: "16"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_filter_days_remaining:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ filter days remaining
    config:
      readStart: "25"
      readValueType: uint16

  modbus:poller:ventilation:discrete:
    isBridge: true
    bridge: modbus:tcp:ventilation
    label: ComfoAir Discrete
    config:
      refresh: 60000
      start: 0
      length: 4
      type: discrete

  modbus:data:ventilation:discrete:comfoairq_error:
    bridge: modbus:poller:ventilation:discrete
    label: ComfoAirQ error active
    config:
      readStart: "0"
      readValueType: bit

  modbus:data:ventilation:discrete:comfoairq_standby:
    bridge: modbus:poller:ventilation:discrete
    label: ComfoAirQ standby active
    config:
      readStart: "1"
      readValueType: bit

