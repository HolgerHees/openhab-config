    label: ComfoAirQ filter dirty
    config:
      readStart: "3"
      readValueType: bit

  modbus:poller:ventilation:coil:
    isBridge: true
    bridge: modbus:tcp:ventilation
    label: ComfoAir Coil
    config:
      refresh: 0
      start: 0
      length: 9
      type: coil

  modbus:data:ventilation:coil:comfoairq_reset_error:
    bridge: modbus:poller:ventilation:coil
