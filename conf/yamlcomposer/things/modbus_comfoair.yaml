  modbus:data:ventilation:input:comfoairq_t_indoor_in:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ indoor in temperature
    config:
      readStart: "11"
      readTransform:
        - "PY(|int(input)/10.0)"
      readValueType: int16

