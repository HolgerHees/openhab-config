version: 1

things:
  modbus:tcp:ventilation:
    isBridge: true
    label: ComfoAir Bridge
    config:
      host: ${ENV.CUSTOM_COMFO_AIR_IP}
      port: 502
      id: 1

  modbus:poller:ventilation:input:
    isBridge: true
    bridge: modbus:tcp:ventilation
    label: ComfoAir Input
    config:
      refresh: 15000
      start: 0
      length: 26
      type: input

  modbus:data:ventilation:input:comfoairq_connection_state:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ connection state
    config:
      readStart: "0"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_active_error_1:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ active error 1
    config:
      readStart: "1"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_active_error_2:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ active error 2
    config:
      readStart: "2"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_active_error_3:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ active error 3
    config:
      readStart: "3"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_active_error_4:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ active error 4
    config:
      readStart: "4"
      readValueType: uint16

  modbus:data:ventilation:input:comfoairq_active_error_5:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ active error 5
    config:
      readStart: "5"
      readValueType: uint16

  #modbus:data:ventilation:input:comfoairq_airflow:
