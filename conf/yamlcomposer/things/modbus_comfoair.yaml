  modbus:poller:ventilation:holding:
    isBridge: true
    bridge: modbus:tcp:ventilation
    label: ComfoAir Holding
    config:
      refresh: 60000
      start: 0
      length: 5
      type: holding

  modbus:data:ventilation:holding:comfoairq_preset: #  // 0 - 3
    bridge: modbus:poller:ventilation:holding
    label: ComfoAirQ preset
    config:
      readStart: "0"
      readValueType: int16
      writeStart: "0"
      writeType: holding
      writeValueType: int16

  #modbus:data:ventilation:holding:comfoairq_t_profile: #  // 0 normal, 1 cold, 2 warm (only mode 0 and 1)
  #  bridge: modbus:poller:ventilation:holding
  #  label: ComfoAirQ temperature profile
  #  config:
  #    readStart: "1"
  #    readValueType: int16
  #    writeStart: "1"
  #    writeType: holding
  #    writeValueType: int16

  modbus:data:ventilation:holding:comfoairq_t_profile_mode:
    bridge: modbus:poller:ventilation:holding
    label: ComfoAirQ temperature profile mode
    config:
      readStart: "2"
      readValueType: int16
      writeStart: "2"
      writeType: holding
      writeValueType: int16

  modbus:data:ventilation:holding:comfoairq_t_external_setpoint: # // °C (only mode 2)
    bridge: modbus:poller:ventilation:holding
    label: ComfoAirQ temperature external setpoint
    config:
      readStart: "3"
      readTransform:
        - PY(|int(input)/10.0)
      readValueType: int16
      writeStart: "3"
      writeType: holding
      writeTransform:
        - PY(|int(float(input) * 10.0))
      writeValueType: int16

