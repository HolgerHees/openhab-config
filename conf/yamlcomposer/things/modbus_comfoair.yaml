  modbus:data:ventilation:input:comfoairq_t_indoor_out:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ indoor out temperature
    config:
      readStart: "8"
      readTransform:
        - "PY(|int(input)/10.0)"
      readValueType: int16

  modbus:data:ventilation:input:comfoairq_t_outdoor_out:
    bridge: modbus:poller:ventilation:input
    label: ComfoAirQ outdoor out temperature
    config:
      readStart: "9"
