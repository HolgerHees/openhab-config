version: 1

things:
  fineoffsetweatherstation:gateway:default:
    isBridge: true
    label: Wetterstation Bridge
    config:
      ip: ${ENV.CUSTOM_WEATHERSTATION_IP}
      port: 45000
      protocol: DEFAULT
      pollingInterval: 16
      discoverInterval: 900

  fineoffsetweatherstation:sensor:default:WH90:
    bridge: fineoffsetweatherstation:gateway:default
    label: Wetterstation Haupt Sensor
    config:
      sensor: WH90

  fineoffsetweatherstation:sensor:default:WH26:
    bridge: fineoffsetweatherstation:gateway:default
    label: Wetterstation Extern Sensor
    config:
      sensor: WH26

  fineoffsetweatherstation:sensor:default:WH40:
    bridge: fineoffsetweatherstation:gateway:default
    label: Wetterstation Regen Sensor
    config:
      sensor: WH40

  fineoffsetweatherstation:sensor:default:WH57:
    bridge: fineoffsetweatherstation:gateway:default
    label: Wetterstation Blitz Sensor
    config:
      sensor: WH57
