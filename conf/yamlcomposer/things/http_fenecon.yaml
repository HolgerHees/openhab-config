version: 1

things:
  http:url:fenecon-slow:
    label: Wechselrichter (Slow)
    config:
      baseURL: http://${ENV.CUSTOM_PV_INVERTER_IP}/rest/channel/.*/.*
      refresh: 60
      username: ${ENV.CUSTOM_PV_INVERTER_USERNAME}
      password: !literal ${ENV:CUSTOM_PV_INVERTER_PASSWORD}
      authMode: BASIC_PREEMPTIVE
    channels:
      state:
        type: number
        label: State
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/State')].value)"
          mode: READONLY
      demand-active-energy:
        type: number
        label: Demand Active Energy
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/GridBuyActiveEnergy')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      supply-active-energy:
        type: number
        label: Supply Active Energy
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/GridSellActiveEnergy')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      production-active-energy:
        type: number
        label: Production Active Energy
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ProductionActiveEnergy')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      consumption-active-energy:
        type: number
        label: Consumtion Active Energy
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ConsumptionActiveEnergy')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      ess-soc:
        type: number
        label: Ess Soc
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/EssSoc')].value)"
          mode: READONLY
      ess-capacity:
        type: number
        label: Ess Capacity
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/EssCapacity')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      min-cell-voltage:
        type: number
        label: Min Cell Voltage
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='ess0/MinCellVoltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      max-cell-voltage:
        type: number
        label: Max Cell Voltage
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='ess0/MaxCellVoltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      min-cell-temperature:
        type: number
        label: Min Cell Temperature
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='ess0/MinCellTemperature')].value)"
          mode: READONLY
      max-cell-temperature:
        type: number
        label: Min Cell Temperature
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='ess0/MaxCellTemperature')].value)"
          mode: READONLY
      fems-version:
        type: string
        label: FEMS Version
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_meta/Version')].value)"
          mode: READONLY
      batt-tower-soh:
        type: number
        label: Zustand
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Soh')].value)"
          mode: READONLY
      batt-tower-voltage:
        type: number
        label: Spannung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Tower0PackVoltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      batt-tower-current:
        type: number
        label: Strom
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Current')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      batt-tower0-soh:
        type: number
        label: Zustand (Turm links)
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Tower0Soh')].value)"
          mode: READONLY
      batt-tower0-no-of-cycles:
        type: number
        label: Ladezyklen (Turm links)
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Tower0NoOfCycles')].value)"
          mode: READONLY
      batt-tower1-soh:
        type: number
        label: Zustand (Turm rechts)
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Tower1Soh')].value)"
          mode: READONLY
      batt-tower1-no-of-cycles:
        type: number
        label: Ladezyklen (Turm rechts)
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='battery0/Tower1NoOfCycles')].value)"
          mode: READONLY
      inverter-air-temperature:
        type: number
        label: Luft Temperatur
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='batteryInverter0/AirTemperature')].value)"
          mode: READONLY
      inverter-radiator-temperature:
        type: number
        label: Wechselrichter Temperatur
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='batteryInverter0/RadiatorTemperature')].value)"
          mode: READONLY
      bms-pack-temperature:
        type: number
        label: BMS Box Temperatur
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='batteryInverter0/BmsPackTemperature')].value)"
          mode: READONLY
      charger0-actual-power:
        type: number
        label: Charger 0 Leistung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger0/ActualPower')].value)"
          mode: READONLY
      charger0-voltage:
        type: number
        label: Charger 0 Spannung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger0/Voltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      charger0-current:
        type: number
        label: Charger 0 Strom
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger0/Current')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      charger1-actual-power:
        type: number
        label: Charger 1 Leistung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger1/ActualPower')].value)"
          mode: READONLY
      charger1-voltage:
        type: number
        label: Charger 1 Spannung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger1/Voltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      charger1-current:
        type: number
        label: Charger 1 Strom
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger1/Current')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      charger2-actual-power:
        type: number
        label: Charger 2 Leistung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger2/ActualPower')].value)"
          mode: READONLY
      charger2-voltage:
        type: number
        label: Charger 2 Spannung
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger2/Voltage')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      charger2-current:
        type: number
        label: Charger 2 Strom
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='charger2/Current')].value)∩PY(|int(input)/1000.0)"
          mode: READONLY
      grid-mode:
        type: number
        label: GridMode
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/GridMode')].value)"
          mode: READONLY

  http:url:fenecon-fast:
    label: Wechselrichter (Fast)
    config:
      baseURL: http://${ENV.CUSTOM_PV_INVERTER_IP}/rest/channel/_sum/.*Power.*
      refresh: 5
      username: ${ENV.CUSTOM_PV_INVERTER_USERNAME}
      password: !literal ${ENV:CUSTOM_PV_INVERTER_PASSWORD}
      authMode: BASIC_PREEMPTIVE
    channels:
      grid-active-power:
        type: number
        label: GridActivePower
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/GridActivePower')].value)"
          mode: READONLY
      production-active-power:
        type: number
        label: ProductionActivePower
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ProductionActivePower')].value)"
          mode: READONLY
      consumption-active-power:
        type: number
        label: ConsumptionActivePower
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ConsumptionActivePower')].value)"
          mode: READONLY
      consumption-active-power-l1:
        type: number
        label: ConsumptionActivePowerL1
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ConsumptionActivePowerL1')].value)"
          mode: READONLY
      consumption-active-power-l2:
        type: number
        label: ConsumptionActivePowerL2
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ConsumptionActivePowerL2')].value)"
          mode: READONLY
      consumption-active-power-l3:
        type: number
        label: ConsumptionActivePowerL3
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/ConsumptionActivePowerL3')].value)"
          mode: READONLY
      ess-active-power:
        type: number
        label: EssDischargePower
        config:
          stateTransformation: "JSONPATH($..[?(@.address=='_sum/EssDischargePower')].value)"
          mode: READONLY

  http:url:fenecon-control:
    label: Wechselrichter (Control)
    config:
      baseURL: http://${ENV.CUSTOM_PV_INVERTER_IP}/rest/channel/
      refresh: 3600
      username: ${ENV.CUSTOM_PV_INVERTER_USERNAME}
      password: !literal ${ENV:CUSTOM_PV_INVERTER_PASSWORD}
      authMode: BASIC_PREEMPTIVE
      commandMethod: POST
    channels:
      dummy:
        type: number
        label: Dummy
        config:
          stateExtension: _sum/State
          mode: READONLY
      active-power-equals:
        type: number
        label: ActivePowerEquals
        config:
          commandTransformation: "PY(|\"{'value': \" + (str(input) if input != '999999999' else 'null') + \"}\")"
          commandExtension: ess0/SetActivePowerEquals
          mode: WRITEONLY
      active-power-less-or-equals:
        type: number
        label: ActivePowerLessOrEquals
        config:
          commandTransformation: "PY(|\"{'value': \" + (str(input) if input != '999999999' else 'null') + \"}\")"
          commandExtension: ess0/SetActivePowerLessOrEquals
          mode: WRITEONLY
      active-power-greater-or-equals:
        type: number
        label: ActivePowerGreaterOrEquals
        config:
          commandTransformation: "PY(|\"{'value': \" + (str(input) if input != '999999999' else 'null') + \"}\")"
          commandExtension: ess0/SetActivePowerGreaterOrEquals
          mode: WRITEONLY
