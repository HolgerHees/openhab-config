#version: 1
widgets:
  widget_floorplan_attic:
    tags: []
    props:
      parameters:
        - description: A text prop
          label: Prop 1
          name: prop1
          required: false
          type: TEXT
        - context: item
          description: An item to control
          label: Item
          name: item
          required: false
          type: TEXT
      parameterGroups: []
    component: div
    config:
      class:
        - "=items['pOther_Automatic_State_Rollershutter'].state === 'ON' ? 'shutterDownAdvise' : ''"
        - oh-grid-item-content
      style:
        position: relative
      stylesheet: |
        svg {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
        }
    slots:
      default:
        - component: Label
          config:
            class:
              - normalState
              - sensorTopModifier
              - sensorTemperatureSuffix
            text: =Number.parseFloat(items['pFF_Attic_Air_Sensor_Temperature_Value'].state).toFixed(1)
            style:
              position: absolute
              top: 45%
              left: 52%
        - component: Label
          config:
            class:
              - normalState
              - sensorHumiditySuffix
              - sensorBottomModifier
            text: =Number.parseInt(items['pFF_Attic_Air_Sensor_Humidity_Value'].state)
            style:
              position: absolute
              top: 54%
              left: 52%
        - component: oh-link
          config:
            id: room_attic_analyzer
            action: command
            actionItem: pFF_Attic_Light_Ceiling_Powered
            actionCommand: "=items['pFF_Attic_Light_Ceiling_Powered'].state === 'ON' ? 'OFF' : 'ON'"
            style:
              display: none
        - component: svg
          config:
            style:
              fill: transparent
              height: 100%
              object-fit: contain
              overflow: visible
              stroke: var(--f7-card-footer-text-color)
              stroke-width: 1.5px
            viewBox: 0 0 1000 736
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/shared/habpanel/svg/icons.svg#haus_floor_attic_grayscaled
        - component: svg
          config:
            viewBox: 0 0 1000 736
            class:
              - floor_actions
            style:
              object-fit: contain
              height: 100%
              fill: transparent
          slots:
            default:
              - component: rect
                config:
                  id: room_attic
                  x: 279px
                  y: 228px
                  width: 689px
                  height: 351px
                  onclick: document.getElementById('room_attic_analyzer').click()
                  class:
                    - "=items['pFF_Attic_Light_Ceiling_Powered'].state === 'ON' ? 'lightActive' : ''"
              - component: rect
                config:
                  id: window_attic
                  x: 255px
                  y: 381px
                  width: 15px
                  height: 44px
                  class:
                    - shutterAvailable
                    - "=items['pFF_Attic_Shutter_Control'].state === '100' ? 'shutterDown' : ''"
                    - "=items['pFF_Attic_Openingcontact_Window_State'].state === 'OPEN' ? 'contactOpen' : ''"
