version: 1

widgets:
  widget_device_heating:
    tags: [
      ]
    props:
      parameters:
        - context: item
          default: pGF_Utilityroom_Heatpump_Auto_Mode
          label: Auto Mode
          name: item_auto_mode
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_S_Betriebstatusanzeige
          label: Betriebstatusanzeige
          name: item_betriebsstatus
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Electricity_State_Heatpump_ActivePower
          label: Verbrauch
          name: item_power_consumption
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_WP_Leistungsanforderung
          label: Leistung
          name: item_power_requested
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_Solar_Power
          label: Solar
          name: item_solar_power
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_Solar_Pump_State
          label: Solar
          name: item_solar_pump_state
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_WW_Warmwassertemperatur
          label: Top Temperature
          name: item_tank_top_temperature
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_WP_Weichentemperatur
          label: Middle Temperature
          name: item_tank_middle_temperature
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_Solar_Temperature_Collector
          label: Collector Temperature
          name: item_collector_temperature
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Heatpump_Solar_Temperature_Storage
          label: Bottom Temperature
          name: item_tank_bottom_temperature
          required: false
          type: TEXT
      parameterGroups: [
        ]
    component: div
    config:
      class:
        - oh-grid-item-content
        - lengendModifier
      style:
        position: relative
        overflow: visible
      stylesheet: |
        div,
        svg {
          position: absolute;
        }
    slots:
      default:
        - component: Label
          config:
            style:
              left: 50%
              top: 5px
              transform: translate(-50%,0)
            class:
              - normalState
            text: "=items[props.item_betriebsstatus].displayState"

        - component: svg
          config:
            style:
              fill: transparent
              stroke: var(--custom-value-color)
              stroke-width: 0.8
              left: 50%
              top: 50%
              width: 105px
              height: 105px
              transform: translate(-50%,-50%)
              opacity: 0.6
            viewBox: 0 0 64 64
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/heatpump.svg#watertank
        - component: Label
          config:
            style:
              left: 50%
              top: 65px
              transform: translate(-50%,0)
              font-size: 0.9em
            class:
              - normalState
              - sensorTemperatureSuffix
            text: "=Number.parseFloat(items[props.item_tank_top_temperature].state).toFixed(1)"
        - component: Label
          config:
            style:
              left: 50%
              top: 88px
              transform: translate(-50%,0)
              font-size: 0.9em
            class:
              - normalState
              - sensorTemperatureSuffix
            text: "=Number.parseFloat(items[props.item_tank_middle_temperature].state).toFixed(1)"
        - component: Label
          config:
            style:
              left: 50%
              top: 111px
              transform: translate(-50%,0)
              font-size: 0.9em
            class:
              - normalState
              - sensorTemperatureSuffix
            text: "=Number.parseFloat(items[props.item_tank_bottom_temperature].state).toFixed(1)"






        - component: svg
          config:
            style:
              fill: transparent
              stroke: "=Number.parseFloat(items[props.item_solar_pump_state].state) == '0' ? 'var(--custom-value-color)' : 'var(--custom-yellow-dark)'"
              stroke-width: 1
              width: 50px
              height: 50px
              left: 5px
              bottom: 50%
              transform: translate(0,45%)
              opacity: "=Number.parseFloat(items[props.item_solar_pump_state].state) == '0' ? '0.4' : '1.0'"
            viewBox: 0 0 64 64
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/heatpump.svg#solar

        - component: div
          config:
            style:
              width: 25px
              height: 10px
              left: calc(5% + 43px)
              bottom: 40%
              visibility: "=Number.parseFloat(items[props.item_solar_pump_state].state) > 0 ? 'visible' : 'hidden'"
          slots:
            default:
              - !include { file: device_energy_line.inc.yaml, vars: {uid: "heating_path_solar", width: 25, height: 10, direction: "right"}}
        - component: Label
          config:
            style:
              left: 5%
              bottom: 130px
            class:
              - normalState
              - sensorTemperatureSuffix
            text: "=Number.parseFloat(items[props.item_collector_temperature].state).toFixed(1)"
        - component: Label
          config:
            style:
              left: 5%
              bottom: 55px
            class:
              - normalState
              - "=Number.parseFloat(items[props.item_solar_power].state) > 0 ? 'highlightModifier' : ''"
              - sensorEnergySuffix
            text: "=Number.parseFloat(items[props.item_solar_power].state).toFixed(1)"







        - component: svg
          config:
            style:
              fill: transparent
              stroke: "=items[props.item_power_requested].state == '0' ? 'var(--custom-value-color)' : 'var(--custom-yellow-dark)'"
              stroke-width: 4
              right: 5%
              bottom: 50%
              width: 40px
              height: 40px
              transform: translate(0,50%)
              opacity: "=items[props.item_power_requested].state == '0' ? '0.4' : '0.6'"
            viewBox: 0 0 64 64
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/heatpump.svg#heatpump

        - component: div
          config:
            style:
              width: 25px
              height: 10px
              right: calc(5% + 42px)
              bottom: 50%
              visibility: "=Number.parseFloat(items[props.item_power_requested].state) > 0 ? 'visible' : 'hidden'"
          slots:
            default:
              - !include { file: device_energy_line.inc.yaml, vars: {uid: "heating_path_heatpump", width: 25, height: 10, direction: "left"}}

        - component: Label
          config:
            style:
              right: 5%
              bottom: 55px
            class:
              - normalState
              - "=Number.parseFloat(items[props.item_power_consumption].state) > 50 ? 'highlightModifier' : ''"
              - sensorEnergySuffix
            text: "=(Number.parseFloat(items[props.item_power_consumption].state) / 1000.0).toFixed(1)"



        - component: Label
          config:
            style:
              left: 50%
              bottom: 12px
              transform: translate(-50%,0)
            class:
              - normalState
            text: "=items[props.item_auto_mode].displayState"
