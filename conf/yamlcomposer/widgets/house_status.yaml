version: 1
widgets:
  widget_house_status:
    tags: []
    props:
      parameters:
        - context: item
          default: gOpeningcontactsSecurityRelevant
          label: Security group item
          name: item_security
          required: false
          type: TEXT
        - context: item
          default: pOther_State_Message_Garden
          label: Message garden
          name: item_message_garden
          required: false
          type: TEXT
        - context: item
          default: pOther_State_Message_Devices
