          name: item_message_auto
          required: false
        - context: item
          default: pOther_Manual_State_Security_Notify
          label: Security Notification
          name: item_security_notify
          required: false
      parameterGroups: []
    component: oh-card
    config:
      action: popup
      actionModal: widget:widget_popup_sitemap
      contentStyle:
        height: 100%
        justify-content: flex-start
        padding: var(--custom-widget-padding) !important
      stylesheet: |
        div.row div.col:first-child {
          margin: auto;
        }
    slots:
      content:
        - component: f7-row
          config:
            style:
              width: 100%
          slots:
            default:
              - component: f7-col
                config:
                  style:
                    display: flex
                    flex-basis: 27px
                    flex-grow: 0
                    height: 100%
                    padding-right: 3px
                    text-align: left
                slots:
                  default:
                    - component: svg
                      config:
                        style:
                          display: inline-block
                          fill: var(--custom-default-color)
                          stroke: var(--custom-default-color)
                          width: 20px
                        viewBox: 0 0 64 64
                      slots:
                        default:
                          - component: use
                            config:
                              xlink:href: /static/shared/habpanel/svg/icons.svg#self_window_grayscaled
              - component: f7-col
                config:
                  style:
                    flex-grow: 0
                    text-align: left
                slots:
                  default:
                    - component: Label
                      config:
                        class: normalText
                        text: Fenster
              - component: f7-col
                config:
                  style:
                    flex-grow: 1
                    text-align: right
                slots:
                  default:
                    - component: Label
                      config:
                        class:
                          - highlightModifier
                          - "=(items[props.item_security].state !== 'CLOSED') ? 'errorState' : 'normalState'"
                        text: "=(items[props.item_security].state !== 'CLOSED') ? 'Offen' : 'Alles zu'"
