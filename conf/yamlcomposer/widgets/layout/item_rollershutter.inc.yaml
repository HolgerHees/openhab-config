variables:
  title: ""
  item: ""
  icon: "oh:selfrollershutter"
  iconstate: ""
  display: ""

component: li
config:
  style:
    <<: !if
      if: display
      then:
        display: "=${display} ? '' : 'none'"
  class:
    - rollershutter
slots:
  default:
    - component: oh-icon
      config:
        class:
          - icon
        height: 32px
        icon: "${icon}"
        <<: !if
            - if: iconstate
              then:
                state: "=${iconstate}"
            - elseif: item
              then:
                state: "=items['${item}'].state"
    - component: Label
      config:
        class:
          - name
        text: "${title}"
    - component: oh-rollershutter
      config:
        class:
          - value
        item: "${item}"
