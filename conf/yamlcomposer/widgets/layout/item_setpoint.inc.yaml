variables:
  title: ""
  item: ""
  icon: "oh:selfsettings"
  iconstate: ""
  display: ""
  step: 1
  min: 1
  max: 10

component: li
config:
  style:
    <<: !if
      if: display
      then:
        display: "=${display} ? '' : 'none'"
  class:
    - setpoint
slots:
  default:
    - component: oh-icon
      config:
        class:
          - icon
        height: 32px
        icon: "${icon}"
        <<: !if
            - if: iconstate
              then:
                state: "=${iconstate}"
            - elseif: item
              then:
                state: "=items['${item}'].state"
    - component: Label
      config:
        class:
          - name
        text: "${title}"
    - component: oh-stepper-item
      config:
        item: ${item}
        min: ${min}
        max: ${max}
        step: ${step}
