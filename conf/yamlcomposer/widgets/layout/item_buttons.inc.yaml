variables:
  title: ""
  item: ""
  icon: "oh:selfsettings"
  iconstate: ""
  display: ""
  mappings: ""

component: li
config:
  style:
    <<: !if
      if: display
      then:
        display: "=${display} ? '' : 'none'"
  class:
    - switch
slots:
  default:
    - component: oh-icon
      config:
        class:
          - icon
        height: 32px
        icon: "${icon}"
        <<: !if
            - if: iconstate
              then:
                state: "=${iconstate}"
            - elseif: item
              then:
                state: "=items['${item}'].state"
    - component: Label
      config:
        class:
          - name
        text: "${title}"
    - component: div
      slots:
        default:
          - !if
            if: mappings
            then:
              component: oh-repeater
              config:
                sourceType: array
                in: "='${mappings}'.split(',')"
                for: entry
                containerClasses:
                  - value
              slots:
                default:
                  - component: oh-button
                    config:
                      class:
                        - value
                      action: command
                      actionCommand: =loop.entry[0]
                      actionItem: ${item}
                      class:
                        - "=items['${item}'].state == loop.entry.split('=')[0] ? 'button-active' : ''"
                      text: =loop.entry.split('=')[1]
            else:
              component: oh-repeater
              config:
                sourceType: itemStateOptions
                itemOptions: ${item}
                for: entry
                containerClasses:
                  - value
              slots:
                default:
                  - component: oh-button
                    config:
                      class:
                        - "=items['${item}'].state == loop.entry.value ? 'button-active' : ''"
                      popupClose: true
                      action: command
                      actionCommand: =loop.entry.value
                      actionItem: ${item}
                      #raised: true
                      text: =loop.entry.label
