variables:
  title: ""
  item: ""
  icon: "oh:selfsettings"
  display: ""
  mappings: ""

component: li
config:
  style:
    <<: !if
      if: display
      then:
        display: "=${display} ? '' : 'none'"
  class:
    - switch
slots:
  default:
    - component: oh-icon
      config:
        class:
          - icon
        height: 32px
        icon: "${icon}"
        state: "=items['${item}'].state"
    - component: Label
      config:
        class:
          - name
        text: "${title}"
    - !if
      if: mappings
      then:
        component: oh-repeater
        config:
          sourceType: array
          in: "='${mappings}'.split(',')"
          for: entry
        slots:
          default:
            - component: oh-button
              config:
                class:
                  - value
                action: command
                actionCommand: =loop.entry[0]
                actionItem: ${item}
                class:
                  - button
                  - "=items['${item}'].state == loop.entry.split('=')[0] ? 'button-active' : ''"
                  - highlightModifier
                text: =loop.entry.split('=')[1]
      else:
        component: oh-repeater
        config:
          sourceType: itemStateOptions
          itemOptions: ${item}
          for: entry
          listContainer: true
        slots:
          default:
            - component: oh-button
              config:
                class:
                  - button
                  - "=items['${item}'].state == loop.entry.value ? 'button-active' : ''"
                  - highlightModifier
                popupClose: true
                action: command
                actionCommand: =loop.entry.value
                actionItem: ${item}
                #raised: true
                text: =loop.entry.label
