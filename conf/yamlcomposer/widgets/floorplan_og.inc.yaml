component: div
config:
  style:
    position: relative
    width: 100%
    height: 100%
slots:
  default:
    - component: Label
      config:
        class:
          - "=Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state) > 1500 ? 'errorState' : (Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state) > 900 ? 'warnState' : 'activeState')"
          - lengendModifier
          - highlightModifier
          - sensorCO2Modifier
        style:
          left: 25%
          position: absolute
          top: -5px
        text: CO2
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorCO2Suffix
        style:
          left: 41%
          position: absolute
          top: 31%
        text: =Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state)
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
          - "=items['pFF_Bedroom_Heating_Circuit'].state === 'ON' ? 'activeState' : 'normalState'"
        style:
          left: 55%
          position: absolute
          top: 10%
        text: =Number.parseFloat(items['pFF_Bedroom_Air_Sensor_Temperature_Value'].state).toFixed(1)
    - component: Label
      config:
        class:
          - normalState
          - sensorBottomModifier
          - sensorHumiditySuffix
        style:
          left: 55%
          position: absolute
          top: 19%
        text: =Number.parseInt(items['pFF_Bedroom_Air_Sensor_Humidity_Value'].state)
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
        style:
          left: 30%
          position: absolute
          top: 14%
        text: =Number.parseFloat(items['pFF_Dressingroom_Air_Sensor_Temperature_Value'].state).toFixed(1)
    - component: Label
      config:
        class:
          - normalState
          - sensorBottomModifier
          - sensorHumiditySuffix
        style:
          left: 30%
          position: absolute
          top: 23%
        text: =Number.parseInt(items['pFF_Dressingroom_Air_Sensor_Humidity_Value'].state)
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
          - "=items['pFF_Makeuproom_Heating_Circuit'].state === 'ON' ? 'activeState' : 'normalState'"
        style:
          left: 78%
          position: absolute
          top: 20%
        text: =Number.parseFloat(items['pFF_Makeuproom_Air_Sensor_Temperature_Value'].state).toFixed(1)
    - component: Label
      config:
        class:
          - normalState
          - sensorBottomModifier
          - sensorHumiditySuffix
        style:
          left: 78%
          position: absolute
          top: 29%
        text: =Number.parseInt(items['pFF_Makeuproom_Air_Sensor_Humidity_Value'].state)
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
          - "=items['pFF_Fitnessroom_Heating_Circuit'].state === 'ON' ? 'activeState' : 'normalState'"
        style:
          left: 78%
          position: absolute
          top: 63%
        text: =Number.parseFloat(items['pFF_Fitnessroom_Air_Sensor_Temperature_Value'].state).toFixed(1)
    - component: Label
      config:
        class:
          - normalState
