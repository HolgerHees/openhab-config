          overflow: visible
          stroke: var(--custom-default-state)
          stroke-width: 1.5px
        viewBox: 0 0 1000 736
      slots:
        default:
          - component: use
            config:
              xlink:href: /static/shared/habpanel/svg/icons.svg#haus_floor_first_grayscaled
    - component: svg
