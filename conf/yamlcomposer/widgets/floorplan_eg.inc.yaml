      config:
        class:
          - "=Number.parseInt(items['pGF_Boxroom_Air_Sensor_CO2_Value'].state) > 1500 || Number.parseInt(items['pGF_Livingroom_Air_Sensor_CO2_Value'].state) > 1500 ? 'errorState' : (Number.parseInt(items['pGF_Boxroom_Air_Sensor_CO2_Value'].state) > 900 || Number.parseInt(items['pGF_Livingroom_Air_Sensor_CO2_Value'].state) > 900 ? 'warnState' : 'activeState')"
          - lengendModifier
          - highlightModifier
          - sensorCO2Modifier
        style:
          left: 25%
          position: absolute
          top: -5px
        text: CO2
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
        style:
          left: 5%
          position: absolute
          top: 48%
        text: =Number.parseFloat(items['pGF_Garage_Air_Sensor_Temperature_Value'].state).toFixed(1)
    - component: Label
      config:
        class:
