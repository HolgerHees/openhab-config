              - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Details", item: "pGF_Garage_Solar_Storage_Requested_Max_Solar_Details", icon: "oh:selfenergy"}}
        - !include
          file: ../layout/box.inc.yaml
          vars:
            title: Discharge
            slots:
              - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Status", item: "pGF_Garage_Solar_Storage_Discharged_Status", icon: "oh:selfenergy"}}
              - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Details", item: "pGF_Garage_Solar_Storage_Discharged_Details", icon: "oh:selfenergy"}}
