    vars:
      slots:
        - !include
          file: ../layout/box.inc.yaml
          vars:
            title: Grid Charge
            slots:
              - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Status", item: "pGF_Garage_Solar_Storage_Requested_Grid_Status", icon: "oh:selfenergy"}}
