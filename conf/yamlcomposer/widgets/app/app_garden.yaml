!include
file: ../layout/widget.inc.yaml
vars:
  uid: app_garden
  title: Garten
  slots:
    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: "='Allgemein • Letztes klingeln [' + dayjs(@@'pOutdoor_Streedside_Gardendoor_Bell_Last_Change').format('DD.MM HH:mm') + ']'"
        slots:
            - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Türöffner", item: "pOutdoor_Streedside_Gardendoor_Opener_Timer", icon: "oh:selfdoor"}}

    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Licht Bewegungsmelder
        slots:
            - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Aktiv", item: "pOutdoor_Light_Automatic_Main_Switch", icon: "oh:selfinfo"}}
            - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Einstellungen", item: "gOutdoor_Automatic_Switch_Counter", icon: "oh:selflightinfo", target: {widget: "widget:app_garden_settings"}}}

    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Licht & Steckdosen
        slots:
            - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Lampen", item: "gOutdoor_Lights_Count", icon: "oh:selflight", target: {widget: "widget:app_lights_outdoor"}}}
            - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Steckdosen", item: "gOutdoor_Sockets_Count", icon: "oh:selfsocket", target: {widget: "widget:app_sockets_outdoor"}}}
            - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Bewässerung", item: "gOutdoor_Watering_Circuits_Count", icon: "oh:selfwater", target: {widget: "widget:app_watering_outdoor"}}}
