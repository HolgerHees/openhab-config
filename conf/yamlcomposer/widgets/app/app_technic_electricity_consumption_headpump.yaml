!include
file: ../layout/widget.inc.yaml
vars:
  uid: app_technic_electricity_consumption_headpump
  title: Technik Strom Verbrauch Wärmepumpe Details
  slots:
    - !include
      file: ../layout/box.inc.yaml
      vars:
        slots:
          - !include
            file: ../layout/box.inc.yaml
            vars:
              slots:
                - !include
                  file: ../layout/box.inc.yaml
                  vars:
                    title: Gesamt
                    slots:
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "JAZ", item: "pGF_Utilityroom_Heatpump_Statistik_JAZ", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Heute", item: "pGF_Utilityroom_Electricity_State_Heatpump_Daily_Consumption", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Dieses Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Annual_Consumption_Msg", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Letztes Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Annual_Consumption_Last", icon: "oh:selfenergy_grid_in"}}
                - !include
                  file: ../layout/box.inc.yaml
                  vars:
                    title: Heizen
                    slots:
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "JAZ", item: "pGF_Utilityroom_Heatpump_Statistik_Heizen_JAZ", icon: "oh:selfenergy_grid_in"}}
