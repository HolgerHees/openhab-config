                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Dieses Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Heating_Annual_Consumption_Msg", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Letztes Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Heating_Annual_Consumption_Last", icon: "oh:selfenergy_grid_in"}}
                - !include
                  file: ../layout/box.inc.yaml
                  vars:
                    title: Warmwasser
                    slots:
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "JAZ", item: "pGF_Utilityroom_Heatpump_Statistik_WW_JAZ", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Heute", item: "pGF_Utilityroom_Electricity_State_Heatpump_Water_Daily_Consumption", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Dieses Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Water_Annual_Consumption_Msg", icon: "oh:selfenergy_grid_in"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Letztes Jahr", item: "pGF_Utilityroom_Electricity_State_Heatpump_Water_Annual_Consumption_Last", icon: "oh:selfenergy_grid_in"}}
                - !include
                  file: ../layout/box.inc.yaml
                  vars:
                    title: Details
                    slots:
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Gerät Aktuell", item: "pGF_Utilityroom_Electricity_State_Heatpump_Main_ActivePower", icon: "oh:selfenergy"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Compressor Aktuell", item: "pGF_Utilityroom_Electricity_State_Heatpump_Compressor_ActivePower", icon: "oh:selfenergy"}}
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Electric Aktuell", item: "pGF_Utilityroom_Electricity_State_Heatpump_Electric_ActivePower", icon: "oh:selfenergy"}}
                - !include
                  file: ../layout/box.inc.yaml
                  vars:
                    title: Stromzähler
                    slots:
                      - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Gesamt", item: "pGF_Utilityroom_Electricity_State_Heatpump_Total_Consumption", icon: "oh:selfenergy_grid_in"}}
