!include
file: ../layout/widget.inc.yaml
vars:
  uid: app_watering_outdoor_auto
  title: Aktive Kreise
  slots:
    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Rasen
        slots:
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Garten links", item: "pOutdoor_Garden_Left_Watering_Auto", icon: "oh:selfwater"}}
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Garten rechts", item: "pOutdoor_Garden_Right_Watering_Auto", icon: "oh:selfwater"}}
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Strasse", item: "pOutdoor_Streetside_Lawn_Watering_Auto", icon: "oh:selfwater"}}
    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Beete & Hecken
        slots:
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Terasse", item: "pOutdoor_Terrace_Watering_Auto", icon: "oh:selfwater"}}
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Strasse", item: "pOutdoor_Streetside_Beds_Watering_Auto", icon: "oh:selfwater"}}
          - !include { file: ../layout/item_toggle.inc.yaml, vars: {title: "Brombeeren", item: "pOutdoor_Garden_Back_Watering_Auto", icon: "oh:selfwater"}}
