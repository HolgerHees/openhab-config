!include
file: ../layout/widget.inc.yaml
vars:
  uid: app_sensors_plants
  title: Sensoren Pflanzen
  slots:
    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Flächen
        slots:
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Rasen links", item: "pOutdoor_Plant_Sensor_Lawn_Back_Left_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Lawn_Back_Left_State']", target: {widget: "widget:app_sensors_plants_lawn_back_left"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Rasen vorne", item: "pOutdoor_Plant_Sensor_Lawn_Streedside_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Lawn_Streedside_State']", target: {widget: "widget:app_sensors_plants_lawn_streedside"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Terasse", item: "pOutdoor_Plant_Sensor_Terrace_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Terrace_State']", target: {widget: "widget:app_sensors_plants_terrace"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Hecke Strasse", item: "pOutdoor_Plant_Sensor_Hedge_Street_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Hedge_Street_State']", target: {widget: "widget:app_sensors_plants_hedge_street"}}}

    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Pflanzen
        slots:
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Dachboden", item: "pIndoor_Plant_Sensor_Mobile_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pIndoor_Plant_Sensor_Mobile_State']", target: {widget: "widget:app_sensors_plants_attic"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Tomaten", item: "pOutdoor_Plant_Sensor_Tomatos_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Tomatos_State']", target: {widget: "widget:app_sensors_plants_tomatos"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Brombeeren", item: "pOutdoor_Plant_Sensor_Blackberries_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Blackberries_State']", target: {widget: "widget:app_sensors_plants_blackberries"}}}

          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Blumenbeet hinten rechts", item: "pOutdoor_Plant_Sensor_Bed_Back_Right_Msg", icon: "oh:selfplant", valuecolor: "({'3':'#cbcb00','4':'#d72a2a'})[@@'pOutdoor_Plant_Sensor_Bed_Back_Right_State']", target: {widget: "widget:app_sensors_plants_red_back_right"}}}

    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: Auswertung
        slots:
          - !include { file: ../layout/web_time.inc.yaml}
          - !include { file: ../layout/web_frame.inc.yaml, vars: {url: "/static/custom/grafana/pflanzen.html?fromItem=Chart_From", height: 1091px}}

    - !include
      file: ../layout/box.inc.yaml
      vars:
        title: "='Batterien ' + @@'pOther_Plant_Sensor_State_Device_Info'"
        slots:
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Rasen hinten", item: "pOutdoor_Plant_Sensor_Lawn_Back_Left_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Lawn_Back_Left_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Rasen vorne", item: "pOutdoor_Plant_Sensor_Lawn_Streedside_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Lawn_Streedside_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Terasse", item: "pOutdoor_Plant_Sensor_Terrace_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Terrace_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Hecke Strasse", item: "pOutdoor_Plant_Sensor_Hedge_Street_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Hedge_Street_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Dachboden", item: "pIndoor_Plant_Sensor_Mobile_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pIndoor_Plant_Sensor_Mobile_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Tomaten", item: "pOutdoor_Plant_Sensor_Tomatos_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Tomatos_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Brombeeren", item: "pOutdoor_Plant_Sensor_Blackberries_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Blackberries_Battery_Level' < 30 ? '#d72a2a' : ''"}}
          - !include { file: ../layout/item_text.inc.yaml, vars: {title: "Blumenbeet hinten rechts", item: "pOutdoor_Plant_Sensor_Bed_Back_Right_Battery_Level", icon: "oh:selfbattery", valuecolor: "#'pOutdoor_Plant_Sensor_Bed_Back_Right_Battery_Level' < 30 ? '#d72a2a' : ''"}}

