component: svg
config:
  style:
    left: 0
    height: 100%
    width: 100%
  #preserveAspectRatio: xMidYMid slice
  tag: svg
  viewBox: 0 0 ${width} ${height}
slots:
  default:
    - component: f7-row
      config:
        d: !if
          - if: direction == 'down'
            then: "M ${width/2} 0 l 0 ${height}"
          - elseif: direction == 'up'
            then: "M ${width/2} ${height} l 0 -${height}"
          - elseif: direction == 'right'
            then: "M 0 ${height/2} l ${width} 0"
          - elseif: direction == 'left'
            then: "M ${width} ${height/2} l -${width} 0"
        fill: none
        id: ${uid}
        stroke: "#999999"
        stroke-width: 2
        tag: path
        vector-effect: non-scaling-stroke
        visible: true
    - component: f7-row
      config:
        fill: "#BBBBBB"
        d: !if
          - if: direction == 'down'
            then: "M -${width/2} 0 l ${width/2} ${width/2} l ${width/2} -${width/2}"
          - elseif: direction == 'up'
            then: "M -${width/2} 0 l ${width/2} -${width/2} l ${width/2} ${width/2}"
          - elseif: direction == 'right'
            then: "M 0 ${height/2} l ${height/2} -${height/2} l -${height/2} -${height/2}"
          - elseif: direction == 'left'
            then: "M ${height/2} ${height/2} l -${height/2} -${height/2} l ${height/2} -${height/2}"
        tag: path
        vectorEffect: non-scaling-stroke
        visible: true
        style:
            overflow: visible
      slots:
        default:
          - component: f7-row
            config:
              calcMode: linear
              dur: "=(Math.max(${width},${height})/13) + 's'" #3s
              repeatCount: indefinite
              tag: animateMotion
            slots:
              default:
                - component: f7-row
                  config:
                    tag: mpath
                    xlink:href: "#${uid}"
