component: svg
config:
  style:
    #transform: scaleX(-1)
    left: 20%
    top: 50%
    height: auto
    width: auto
  preserveAspectRatio: xMidYMid slice
  tag: svg
  viewBox: 0 0 100 100
slots:
  default:
    - component: f7-row
      config:
        d: M 0 10 l 10 0 c 40 0 35 10 35 50 l 0 10
        fill: none
        id: path5
        stroke: rgba(100, 150, 200, 0.8)
        stroke-width: 2
        tag: path
        vector-effect: non-scaling-stroke
        visible: true
    - component: f7-row
      config:
        fill: rgba(100, 150, 200, 0.8)
        r: 6
        strokeWidth: 10
        tag: circle
        vectorEffect: non-scaling-stroke
        visible: true
      slots:
        default:
          - component: f7-row
            config:
              calcMode: linear
              dur: 4s
              repeatCount: indefinite
              tag: animateMotion
            slots:
              default:
                - component: f7-row
                  config:
                    tag: mpath
                    xlink:href: "#path5"
