version: 1
widgets:
  widget_device_ventilation:
    tags: []
    props:
      parameters:
        - context: item
          default: pGF_Utilityroom_Ventilation_Auto_Mode
          label: Auto Mode
          name: item_auto_mode
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Fan_Level
          label: Fan Level
          name: item_fan_level
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Clime_Headpump_Status
          label: Headpump Status
          name: item_headpump_status
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Electricity_State_Comfoair_ActivePower
          label: Leistung
          name: item_power_consumption
          required: false
          type: TEXT
      parameterGroups: []
    component: div
    config:
      class:
        - oh-grid-item-content
      style:
        position: relative
        overflow: visible
      stylesheet: |
        svg {
          position: absolute;
        }
        @keyframes rotating {
          from {
            transform: rotate(0deg);
          }
          to {
            transform: rotate(360deg);
          }
        }
        .rotating0 {
          animation: rotating 8s linear infinite;
        }
        .rotating1 {
          animation: rotating 6s linear infinite;
        }
        .rotating2 {
          animation: rotating 4s linear infinite;
        }
        .rotating3 {
          animation: rotating 2s linear infinite;
        }
    slots:
      default:
        - component: Label
          config:
            class:
              - normalState
              - highlightModifier
            text: "Klima"
        - component: svg
          config:
            style:
              fill: transparent
              stroke: var(--custom-default-color) #"=Number.parseFloat(items[props.item_grid_energy].state) > 50 ? 'var(--custom-yellow)' : ( Number.parseFloat(items[props.item_grid_energy].state) < -50 ? 'var(--custom-green)' : 'var(--custom-default-color)')"
              #stroke: var(--custom-default-state)
              stroke-width: 1.0px
              right: 5%
              top: 27%
              width: 60px
              height: 60px
              transform: translate(0,-50%)
              opacity: 0.6
            viewBox: 0 0 64 64
            class:
              - "='rotating' + items[props.item_fan_level].state"
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/clime.svg#airing
        - component: Label
          config:
            style:
              position: absolute
              left: 10px
              top: 27%
              transform: translate(0,-50%)
            class:
              - normalState
            text: "=(items[props.item_auto_mode].state === 'ON' ? 'Automatik' : 'Manuell')"
        - component: Label
          config:
            style:
              position: absolute
              left: 10px
              top: 40%
              transform: translate(0,-50%)
            class:
              - normalState
            text: "=('Stufe: ' + items[props.item_fan_level].state)"
        - component: Label
          config:
            style:
              position: absolute
              left: 10px
              top: 53%
              transform: translate(0,-50%)
            class:
              - normalState
            text: "=('Modus: ' + items[props.item_headpump_status].displayState)"
        - component: Label
          config:
            style:
              position: absolute
              left: 50%
              bottom: 5px
              transform: translate(-50%,0)
            class:
              - normalState
            text: "=('Leistung: ' + items[props.item_power_consumption].state)"
