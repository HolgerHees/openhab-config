version: 1
widgets:
  dashboard_tablet_camera:
    tags: []
    props:
      parameters:
        - label: Preview Image
          name: image_url
          required: false
          type: TEXT
        - label: Live Video
          name: video_url
          required: false
          type: TEXT
      parameterGroups: []
    component: div
    config:
      class:
        - card
        - oh-canvas-item-content
      style:
        position: relative
        display: flex
        flex-direction: columns
        justify-content: center
        align-items: center
      stylesheet: |
        img {
          max-width: 100%;
          width: 100%;
          height: 100%;
          object-fit: contain;
        }
    slots:
      default:
        - component: div
          config:
            style:
          slots:
            default:
              - component: script
                config:
                  src: "/static/shared/widgets/video.js"
              - component: script
                config:
                  src: "/static/shared/widgets/camera.js"
              - component: link
                config:
                  rel: stylesheet
                  href: "/static/shared/widgets/camera.css"
              - component: oh-image
                config:
                  onload: "='mvCamera.build(event, \\'' + props.image_url + '\\', \\'' + props.video_url + '\\')'"
                  url: =props.image_url
