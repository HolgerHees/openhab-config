version: 1
widgets:
  dashboard_tablet_welcome:
    tags: []
    props:
      parameters:
        - context: item
          default: pOutdoor_Watering_Logic_Program_State
          label: Item
          name: item
          required: false
          type: TEXT
      parameterGroups: []
    component: f7-card
    config:
      style:
        overflow: hidden
    slots:
      default:
        #- component: script
        #  config:
        #    text: "if( localStorage.getItem('openhab.ui:panel.visibleBreakpointDisabled') == 'false'){ localStorage.setItem('openhab.ui:panel.visibleBreakpointDisabled', 'true'); window.location.reload(); }"
        - component: f7-card-content
          config:
            style:
              width: 100%
              padding: 0
              will-change: transform
              animation: "=(items[props.item].state != 'läuft nicht') ? 'slideAnimation 3s linear infinite' : 'none'"
              #transform: translateY(-77px)
            stylesheet: |
              @keyframes slideAnimation {
                0% {
                  transform: translateY(0);
                }
                15% {
                  transform: translateY(-77px);
                }
                50% {
                  transform: translateY(-77px);
                }
                65% {
                  transform: translateY(-154px);
                }
                100% {
                  transform: translateY(-154px);
                }
              }
          slots:
            default:
              - component: div
                config:
                  id: clock
                  style:
                    height: 77px
                    width: 100%
                    display: flex
                    justify-content: center
                    align-items: center
                    #gap: 5px
                slots:
                  default:
                    - component: f7-cell
                      slots:
                        default:
                          - component: oh-clock
                            config:
                              format: "dddd[,] D. MMM[,] HH:mm [Uhr]"
                              class:
                                - highlightModifier
                              style:
                                color: var(--custom-value-color)
                                font-size: var(--custom-welcome-head-font-size)
              - component: div
                config:
                  style:
                    height: 77px
                    width: 100%
                    align-items: center
                    justify-content: center
                    display: "=(items[props.item].state != 'läuft nicht') ? 'flex' : 'none'"
                    #background-color: red
                slots:
                  default:
                    - component: Label
                      config:
                        text: "='Bewässerung: ' + items[props.item].state"
                        class:
                          - highlightModifier
                        style:
                          color: var(--custom-value-color)
                          font-size: var(--custom-welcome-info-font-size)
              - component: div
                config:
                  id: clock
                  style:
                    height: 77px
                    width: 100%
                    display: flex
                    justify-content: center
                    align-items: center
                    gap: 5px
                slots:
                  default:
                    - component: f7-cell
                      slots:
                        default:
                          - component: oh-clock
                            config:
                              format: "dddd[,] D. MMM[,] HH:mm [Uhr]"
                              class:
                                - highlightModifier
                              style:
                                color: var(--custom-value-color)
                                font-size: var(--custom-welcome-head-font-size)
