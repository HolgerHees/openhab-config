version: 1
widgets:
  dashboard_tablet_device_ventilation:
    tags: []
    props:
      parameters:
        - context: item
          default: pGF_Utilityroom_Ventilation_Auto_Mode
          label: Auto Mode
          name: item_auto_mode
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Fan_Level
          label: Fan Level
          name: item_fan_level
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Clime_Headpump_Status
          label: Headpump Status
          name: item_headpump_status
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Electricity_State_Comfoair_ActivePower
          label: Leistung
          name: item_power_consumption
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Clime_Headpump_Power
          label: Leistung
          name: item_headpump_power
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Bypass_State
          label: Bypass
          name: item_bypass
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Clime_Supply_Temperature
          label: Supply
          name: item_clime_supply
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Outdoor_Incoming_Temperature
          label: Supply
          name: item_outside_supply
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Indoor_Incoming_Temperature
          label: Supply
          name: item_indoor_supply
          required: false
          type: TEXT
        - context: item
          default: pGF_Utilityroom_Ventilation_Supply_Temperature
          label: Supply
          name: item_room_supply
          required: false
          type: TEXT
      parameterGroups: []
    component: f7-card
    config:
      class:
        - oh-canvas-item-content
        - lengendModifier
      style:
        height: 100%
        justify-content: flex-start
        padding: 0
      onclick: "document.querySelector('.ventilationStateOpener').click()"
      stylesheet: |
        .card-content {
          width: 100%;
          height: 100%;
          box-sizing: border-box;
        }
        div,
        svg {
          position: absolute;
        }
        @keyframes rotating {
          from {
            transform: rotate(0deg);
          }
          to {
            transform: rotate(360deg);
          }
        }
        .rotating0 {
          animation: rotating 8s linear infinite;
        }
        .rotating1 {
          animation: rotating 4s linear infinite;
        }
        .rotating2 {
          animation: rotating 2s linear infinite;
        }
        .rotating3 {
          animation: rotating 1s linear infinite;
        }
        svg.roomAir g path.top    { animation-duration: 1.5s; animation-delay: 0.5s; }
        svg.roomAir g path.middle { animation-duration: 1.3s; }
        svg.roomAir g path.bottom { animation-duration: 1.4s; animation-delay: 1.0s; }
        svg.roomAir g path {
              stroke-width: 1.1; /* Dicke der Windlinie */
              stroke-linecap: round;
              stroke-linejoin: round;
              stroke-dasharray: 30 12;
              animation: windFlowAnim 3s linear infinite;
        }

        @keyframes windFlowAnim {
          from {
            stroke-dashoffset: 42; /* Startposition (Summe aus dasharray) */
          }
          to {
            stroke-dashoffset: 0; /* Endposition */
          }
        }
    slots:
      content:
        - !include { file: ../layout/popup.inc.yaml, vars: {name: "ventilationState", widget: "app_technic_ventilation"}}
        - component: Label
          config:
            style:
              right: 50%
              top: var(--custom-widget-padding)
              transform: translate(50%,0)
            class:
              - normalState
              - highlightModifier
              - sensorTemperatureSuffix
            text: "=items[props.item_room_supply].numericState.toFixed(1)"

        - component: svg
          config:
            style:
              fill: transparent;
              stroke: "=[5,21].includes(items[props.item_headpump_status].numericState) ? 'var(--custom-blue)' : 'var(--custom-default-color)'"
              left: 50%
              top: 33px
              width: 30px
              height: 30px
              transform: translate(-50%,0) rotate(-90deg) scale(1.3, 1.0)
            class:
              - roomAir
            viewBox: 0 0 24 24
          slots:
            default:
              - component: g
                slots:
                  default:
                    - component: path
                      config:
                        d: "M3,8 H9.5 C11.5,8 11.5,4.5 9.5,4.5 C7.5,4.5 7.5,8 7.5,8"
                        class:
                          - top
              - component: g
                slots:
                  default:
                    - component: path
                      config:
                        d: "M2,11 H18.5 C21.5,11 21.5,6.5 18.5,6.5 C15.5,6.5 15.5,11 15.5,11"
                        class:
                          - middle
              - component: g
                slots:
                  default:
                    - component: path
                      config:
                        d: "M4,14 H18.5 C21.5,14 21.5,18.5 18.5,18.5 C15.5,18.5 15.5,14 15.5,14"
                        class:
                          - bottom





        - component: svg
          config:
            style:
              fill: transparent
              stroke: "=([5,21].includes(items[props.item_headpump_status].numericState) ? 'var(--custom-blue)' : 'var(--custom-default-color)')"
              stroke-width: 1.0px
              left: "calc(50% - 25px)"
              top: "calc(50% - 35px)"
              width: 50px
              height: 50px
            viewBox: 0 0 64 64
            class:
              - "='rotating' + items[props.item_fan_level].state"
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/clime.svg#airing


        - component: Label
          config:
            style:
              left: 50%
              bottom: 35px
              transform: translate(-50%,0%)
              width: 100%
            class:
              - normalState
            text: "=(items[props.item_auto_mode].state === 'ON' ? 'Automatik' : 'Manuell')"




        - component: Label
          config:
            style:
              left: 42px
              bottom: 69px
              transform: translate(-50%,0)
            class:
              - normalState
              - highlightModifier
              - sensorTemperatureSuffix
            text: "=items[props.item_indoor_supply].numericState.toFixed(1)"
        - component: svg
          config:
            style:
              fill: "=items[props.item_bypass].numericState == 0 ? 'var(--custom-green)' : 'var(--custom-blue)'"
              stroke-width: 0
              left: 16px
              bottom: 31px
              width: 42px
              height: 42px
              opacity: "=items[props.item_bypass].numericState == 0 ? '0.6' : '0.7'"
            viewBox: 0 0 64 64
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/clime.svg#bypass
        - component: div
          config:
            style:
              width: 45px
              height: 30px
              left: 33px
              bottom: 91px
          slots:
            default:
              - !include { file: inc/device_ventilation_curve.inc.yaml, vars: {uid: "ventilation_path_bypass", width: 45, height: 30, path: "M 5 30 l 0 -10 Q 5 5 20 5 l 25 0", marker: "arrow"}}
        - component: Label
          config:
            style:
              left: 42px
              bottom: 12px
              transform: translate(-50%,0)
            class:
              - normalState
              - highlightModifier
              - sensorTemperatureSuffix
            text: "=items[props.item_outside_supply].numericState.toFixed(1)"









        - component: Label
          config:
            style:
              right: 41px
              bottom: 69px
              transform: translate(50%,0)
              visibility: "=[5,21].includes(items[props.item_headpump_status].numericState) ? 'visible' : 'hidden'"
            class:
              - normalState
              - highlightModifier
              - sensorTemperatureSuffix
            text: "=items[props.item_clime_supply].numericState.toFixed(1)"

        - component: svg
          config:
            style:
              fill: transparent
              stroke: "=[5,21].includes(items[props.item_headpump_status].numericState) ? 'var(--custom-blue)' : 'var(--custom-default-color)'"
              stroke-width: 0.7
              right: 23px
              bottom: 35px
              width: 35px
              height: 35px
              opacity: "=[5,21].includes(items[props.item_headpump_status].numericState) ? '0.7' : '0.4'"
            viewBox: 0 0 64 64
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/custom/clime.svg#cooling

        - component: div
          config:
            style:
              width: 45px
              height: 30px
              right: 35px
              bottom: 91px
              visibility: "=[5,21].includes(items[props.item_headpump_status].numericState) ? 'visible' : 'hidden'"
          slots:
            default:
              - !include { file: inc/device_ventilation_curve.inc.yaml, vars: {uid: "ventilation_path_cooling", width: 42, height: 30, path: "M 40 30 l 0 -10 Q 40 5 25 5 l -25 0", marker: "ice"}}

        - component: Label
          config:
            style:
              right: 41px
              bottom: 12px
              transform: translate(50%,0)
            class:
              - normalState
              - "=items[props.item_power_consumption].numericState >= 10 ? 'highlightModifier' : ''"
              - sensorEnergySuffix
            text: "=(items[props.item_power_consumption].numericState / 1000.0).toFixed(2)"
