component: svg
config:
  style:
    left: 0
    height: 100%
    width: 100%
  #preserveAspectRatio: xMidYMid slice
  tag: svg
  viewBox: 0 0 ${width} ${height}
slots:
  default:
    - component: f7-row
      config:
        d: "${path}"
        fill: none
        id: ${uid}
        stroke: "#999999"
        stroke-width: 2
        tag: path
        vector-effect: non-scaling-stroke
        visible: true
    - component: f7-row
      config:
        fill: "#BBBBBB"
        d: "M 0 -5 l 5.0 5.0 l -5 5.0"
        tag: path
        vectorEffect: non-scaling-stroke
        visible: true
        style:
            overflow: visible
      slots:
        default:
          - component: f7-row
            config:
              calcMode: paced
              dur: "=(Math.max(${width},${height})/13) + 's'" #3s
              repeatCount: indefinite
              tag: animateMotion
              rotate: auto
            slots:
              default:
                - component: f7-row
                  config:
                    tag: mpath
                    xlink:href: "#${uid}"

