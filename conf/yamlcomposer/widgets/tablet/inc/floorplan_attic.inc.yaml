component: div
config:
  style:
    position: relative
    width: 100%
    height: 100%
slots:
  default:
    - component: Label
      config:
        class:
          - normalState
          - sensorTopModifier
          - sensorTemperatureSuffix
        style:
          left: 52%
          position: absolute
          top: 45%
        text: =items['pFF_Attic_Air_Sensor_Temperature_Value'].numericState.toFixed(1)
    - component: Label
      config:
        class:
          - normalState
          - sensorBottomModifier
          - sensorHumiditySuffix
        style:
          left: 52%
          position: absolute
          top: 54%
        text: =items['pFF_Attic_Air_Sensor_Humidity_Value'].numericState.toFixed(0)
    - component: oh-link
      config:
        action: command
        actionCommand: "=items['pFF_Attic_Light_Ceiling_Powered'].state === 'ON' ? 'OFF' : 'ON'"
        actionItem: pFF_Attic_Light_Ceiling_Powered
        id: room_attic_analyzer
        style:
          display: none
    - component: svg
      config:
        style:
          fill: transparent
          height: 100%
          object-fit: contain
          overflow: visible
          stroke: var(--custom-default-state)
          stroke-width: 1.5px
        viewBox: 0 0 1000 736
      slots:
        default:
          - component: use
            config:
              xlink:href: /static/shared/habpanel/svg/icons.svg#haus_floor_attic_grayscaled
    - component: svg
      config:
        class:
          - floor_actions
        style:
          fill: transparent
          height: 100%
          object-fit: contain
        viewBox: 0 0 1000 736
      slots:
        default:
          - component: rect
            config:
              class:
                - "=items['pFF_Attic_Light_Ceiling_Powered'].state === 'ON' ? 'lightActive' : ''"
              height: 351px
              id: room_attic
              onclick: document.getElementById('room_attic_analyzer').click()
              width: 689px
              x: 279px
              y: 228px
          - component: rect
            config:
              class:
                - shutterAvailable
                - "=items['pFF_Attic_Shutter_Control'].state === '100' ? 'shutterDown' : ''"
                - "=items['pFF_Attic_Openingcontact_Window_State'].state === 'OPEN' ? 'contactOpen' : ''"
              height: 44px
              id: window_attic
              width: 15px
              x: 255px
              y: 381px
