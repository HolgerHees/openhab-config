version: 1
widgets:
  widget_room_temperatur_sensor:
    tags: []
    props:
      parameters:
        - default: Wohnzimmer
          label: Title
          name: title
          required: true
          type: TEXT
        - context: item
          default: pGF_Livingroom_Air_Sensor_Temperature_Value
          label: Temperature Item
          name: item_temperature
          required: true
          type: TEXT
        - context: item
          default: pGF_Livingroom_Air_Sensor_Humidity_Value
          label: Humidity Item
          name: item_humidity
          required: true
          type: TEXT
      parameterGroups: []
    component: f7-card
    slots:
      default:
        - component: f7-card-header
          slots:
            default:
              - component: Label
                config:
                  style:
                    padding-top: var(--f7-card-margin-vertical)
                    color: var(--custom-default-color)
                    font-size: var(--custom-legend-font-size)
                    opacity: 0.8
                  text: =props.title
        - component: f7-card-content
          config:
            style:
              height: 100%
              padding: 0
              position: relative
          slots:
            default:
              - component: svg
                config:
                  style:
                    fill: var(--custom-default-state)
                    left: var(--custom-widget-padding)
                    position: absolute
                    stroke: var(--custom-default-state)
                    top: 7px
                    width: 35px
                  viewBox: 0 0 64 64
                slots:
                  default:
                    - component: use
                      config:
                        xlink:href: /static/shared/habpanel/svg/icons.svg#self_temperature_grayscaled
              - component: Label
                config:
                  class:
                    - sensorMain
                    - sensorSuffix
                    - sensorTemperatureSuffix
                  style:
                    position: absolute
                    right: var(--custom-widget-padding)
                    top: -5px
                  text: =Number.parseFloat(items[props.item_temperature].state).toFixed(1)
              - component: Label
                config:
                  class:
                    - sensorSub
                    - sensorSuffix
                    - sensorHumiditySuffix
                  style:
                    bottom: 0
                    position: absolute
                    right: var(--custom-widget-padding)
                  text: =Number.parseInt(items[props.item_humidity].state)
