#version: 1
widgets:
  widget_floorplan_og:
    tags: []
    props:
      parameters:
        - description: A text prop
          label: Prop 1
          name: prop1
          required: false
          type: TEXT
        - context: item
          description: An item to control
          label: Item
          name: item
          required: false
          type: TEXT
      parameterGroups: []
    component: div
    config:
      class:
        - "=items['pOther_Automatic_State_Rollershutter'].state === 'ON' ? 'shutterDownAdvise' : ''"
        - oh-grid-item-content
      style:
        position: relative
      stylesheet: |
        svg {
          position: absolute;
          top: 0;
          right: 0;
          bottom: 0;
          left: 0;
        }
    slots:
      default:
        - component: Label
          config:
            class:
              - "=Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state) > 1500 ? 'errorState' : (Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state) > 900 ? 'warnState' : 'activeState')"
              - sensorCO2Modifier
            text: CO2
            style:
              position: absolute
              top: 0
              left: 0
        - component: Label
          config:
            class:
              - normalState
              - sensorTopModifier
              - sensorCO2Suffix
            text: =Number.parseInt(items['pFF_Bedroom_Air_Sensor_CO2_Value'].state)
            style:
              position: absolute
              top: 31%
              left: 41%
        - component: Label
          config:
            class:
              - sensorTemperatureSuffix
              - "=items['pFF_Bedroom_Heating_Circuit'].state === 'ON' ? 'activeState' : 'normalState'"
            text: =Number.parseFloat(items['pFF_Bedroom_Air_Sensor_Temperature_Value'].state).toFixed(1)
            style:
              position: absolute
              top: 4%
              left: 52%
        - component: Label
          config:
            class:
              - normalState
              - sensorTemperatureSuffix
              - sensorMiddleModifier
            text: =('(' + Number.parseFloat(items['pFF_Bedroom_Heating_Temperature_Target'].state).toFixed(1) + ')')
            style:
              position: absolute
              top: 13%
              left: 52%
        - component: Label
          config:
            class:
              - normalState
              - sensorHumiditySuffix
              - sensorBottomModifier
            text: =Number.parseInt(items['pFF_Bedroom_Air_Sensor_Humidity_Value'].state)
            style:
              position: absolute
              top: 20%
              left: 52%
        - component: Label
          config:
            class:
              - normalState
              - sensorTemperatureSuffix
            text: =Number.parseFloat(items['pFF_Dressingroom_Air_Sensor_Temperature_Value'].state).toFixed(1)
            style:
              position: absolute
              top: 14%
              left: 29%
        - component: Label
          config:
            class:
              - normalState
              - sensorHumiditySuffix
              - sensorBottomModifier
            text: =Number.parseInt(items['pFF_Dressingroom_Air_Sensor_Humidity_Value'].state)
            style:
              position: absolute
              top: 23%
              left: 29%
        - component: Label
