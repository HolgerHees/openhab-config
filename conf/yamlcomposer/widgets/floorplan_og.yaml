            style:
              display: none
        - component: svg
          config:
            viewBox: 0 0 1000 736
            class:
              - floor_plan
            style:
              stroke-width: 1.5px
              stroke: var(--f7-card-footer-text-color)
              fill: transparent
              object-fit: contain
              height: 100%
              overflow: visible
          slots:
            default:
              - component: use
                config:
                  xlink:href: /static/shared/habpanel/svg/icons.svg#haus_floor_second_grayscaled
        - component: svg
          config:
            viewBox: 0 0 1000 736
            class:
              - floor_actions
            style:
              object-fit: contain
              height: 100%
              fill: transparent
          slots:
            default:
              - component: rect
                config:
                  id: room_og_dressing
                  x: 280px
                  y: 100px
                  width: 216px
                  height: 297px
                  onclick: document.getElementById('room_og_dressing_analyzer').click()
                  class:
                    - "=items['pFF_Dressingroom_Light_Ceiling_Powered'].state === 'ON' ? 'lightActive' : ''"
              - component: rect
                config:
                  id: window_og_dressing
                  x: 253px
                  y: 253px
                  width: 15px
                  height: 68px
                  class:
                    - shutterAvailable
                    - "=items['pFF_Dressingroom_Shutter_Control'].state === '100' ? 'shutterDown' : ''"
                    - "=items['pFF_Dressingroom_Openingcontact_Window_State'].state === 'OPEN' ? 'contactOpen' : ''"
