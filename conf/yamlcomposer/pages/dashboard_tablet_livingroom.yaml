        :root {
          --custom-green: #4ab516;
          --custom-green-dark: #4ab51677;
          --custom-yellow: #ffdf6f;
          --custom-yellow-dark: #ffdf6f55;
          --custom-red: #ff0000;
          --custom-red-dark: #ff000077;
          --custom-blue: #4285c7;
          --custom-blue-dark: #4285c788;

          --custom-accent-color: var(--custom-blue);
          --custom-accent-color-dark: var(--custom-blue-dark);

          --custom-legend-font-size: 16px; //var(--f7-card-header-font-size);
          --custom-default-font-size: 19px; //var(--f7-card-header-font-size);
          --custom-welcome-head-font-size: 40px;
          --custom-welcome-info-font-size: 36px;
          --custom-sensor-main-font-size: 32px;
          --custom-sensor-sub-font-size: 22px;
          --custom-sensor-suffix-font-size: 13px;

          --custom-default-color: #FFFFFFAA; //white; //var(--f7-card-footer-text-color);
          --custom-value-color: #FFFFFF; //white; //var(--f7-card-footer-text-color);
          --custom-control-color: #FFFFFFDE;
          --custom-error-state: var(--custom-red);
          --custom-warn-state: #ffa500;
          --custom-active-state: var(--custom-green);
          --custom-default-state: var(--custom-value-color);

          --custom-widget-padding: 8px;

          --f7-theme-color: var(--custom-accent-color);

          --f7-button-fill-bg-color: var(--custom-accent-color-dark);
          --f7-button-pressed-bg-color: var(--custom-accent-color);

          --f7-popup-tablet-width: 829px;
          --f7-popup-tablet-height: 700px;

          --f7-card-margin-vertical: 5px;

          --f7-card-header-min-height: auto;
          --f7-card-header-padding-vertical: 0;
          --f7-card-header-border-color: transparent !important;
        }
        * {
          font-size: var(--custom-default-font-size);
          font-weight: 200;
        }
        .highlightModifier *,
        .highlightModifier {
          font-weight: 350;
        }
        //unimportantModifier {
        //  opacity: 0.8;
        //}
        .lengendModifier *,
        .lengendModifier {
          font-size: var(--custom-legend-font-size);
        }
        .errorState {
          color: var(--custom-error-state);
        }
        .warnState {
          color: var(--custom-warn-state);
        }
        .activeState {
          color: var(--custom-active-state);
        }
        .normalState {
          color: var(--custom-value-color);
        }
        .normalText {
          color: var(--custom-default-color);
        }
        div.circuiteActive {
          color: var(--custom-green);
        }
        svg.floor_outdoor_lights .lightAuto {
        }
        svg.floor_outdoor_lights .lightActive,
        svg.floor_actions .lightActive {
          fill: var(--custom-yellow-dark);
        }
        svg.floor_outdoor_lights .lightDisabled {
          fill: var(--custom-red-dark);
        }
        svg.floor_actions .shutterAvailable.shutterDown {
          fill: var(--custom-green-dark);
        }
        .shutterDownAdvise svg.floor_actions .shutterAvailable {
          fill: #ffa500;
        }
        svg.floor_actions .contactOpen {
          fill: var(--custom-red-dark);
        }
        div.sensorCO2Modifier {
        }
        div.sensorTopModifier {
          font-size: var(--custom-legend-font-size);
          font-weight: 350;
        }
        div.sensorBottomModifier {
          font-size: var(--custom-legend-font-size);
          transform: translate(-2px, 0) scale(0.9);
          opacity: 0.7;
        }
        div.sensorInfo {
          color: var(--custom-default-color);
          opacity: 0.7;
        }
        div.sensorPrefix {
          color: var(--custom-default-color);
          vertical-align: text-top;
          opacity: 0.7;
          padding-right: 5px;
        }
        div.sensorMain {
          color: var(--custom-value-color);
          font-size: var(--custom-sensor-main-font-size);
          font-weight: 350;
        }
        div.sensorSub {
          color: var(--custom-value-color);
          font-size: var(--custom-sensor-sub-font-size);
          font-weight: 300;
        }
        div.sensorPercentSuffix::after,
        div.sensorEnergySuffix::after,
        div.sensorCO2Suffix::after,
        div.sensorTemperatureSuffix::after,
        div.sensorHumiditySuffix::after,
        div.sensorMillimeterSuffix::after,
        div.sensorSpeedSuffix::after {
          font-size: var(--custom-sensor-suffix-font-size);
          vertical-align: text-top;
          opacity: 0.7;
          font-weight: 200;
        }
        div.sensorEnergySuffix::after {
          content: " kW";
        }
        div.sensorCO2Suffix::after {
          content: " ppm";
        }
        div.sensorTemperatureSuffix::after {
          content: " °C";
        }
        div.sensorPercentSuffix::after,
        div.sensorHumiditySuffix::after {
          content: " %";
        }
        div.sensorMillimeterSuffix::after {
          content: " mm";
        }
        div.sensorSpeedSuffix::after {
          content: " km/h";
