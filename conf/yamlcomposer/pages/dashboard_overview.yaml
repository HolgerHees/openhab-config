#version: 1
pages:
  overview2:
    tags: []
    props:
      parameters: []
      parameterGroups: []
    component: oh-layout-page
    config:
      colNum: 17
      fixedType: grid
      hideNavbar: false
      hideSidebarIcon: false
      label: DashboardOverview
      layoutType: fixed
      scale: false
      screenHeight: 712
      screenWidth: 1138
      showFullscreenIcon: false
      sidebar: true
      stylesheet: |
        section:nth-child(4),
        section:nth-child(6),
        section:nth-child(6),
        section:nth-child(9),
        section:nth-child(10),
        section:nth-child(11),
        section:nth-child(12),
        section:nth-child(13),
        section:nth-child(14)
        {
          --f7-card-border-radius: 0;
          --f7-card-bg-color: transparent;
          --f7-card-footer-border-color: transparent;
          --f7-card-box-shadow: none;
          --f7-block-margin: 0;
          transform: translate(0, 5%);
        }
        .errorState {
          color: #e64a19;
        }
        .warnState {
          color: #ffa500;
        }
        .activeState {
          color: green;
        }
        .normalState {
          color: var(--f7-card-footer-text-color);
        }
        .normalText {
          color: var(--f7-card-footer-text-color);
        }
        //svg.floor_actions .circuitActive {
        //  color: green;
        //}
        svg.floor_actions .lightActive {
          fill: rgba(150,150,0,0.5);
        }
        svg.floor_actions .shutterAvailable.shutterDown {
          fill: rgba(38,191,117,1.0)
        }
        .shutterDownAdvise svg.floor_actions .shutterAvailable {
          fill: #ffa500
        }
        svg.floor_actions .contactOpen {
          fill: #e64a19;
        }
        div.sensorCO2Modifier {
        }
        div.sensorTopModifier {
          font-size: 1em;
        }
        div.sensorMiddleModifier {
          font-size: 0.8em;
          opacity: 0.7;
        }
        div.sensorBottomModifier {
          font-size: 0.9em;
          opacity: 0.7;
        }
        div.sensorCO2Suffix::after {
          content: " ppm";
          font-size: 0.8em;
          vertical-align: top;
        }
        div.sensorTemperatureSuffix::after {
          content: " °C";
          font-size: 0.8em;
          vertical-align: top;
        }
        div.sensorHumiditySuffix::after {
          content: " %";
          font-size: 0.8em;
          vertical-align: top;
        }
        div.circuiteActive {
          color: green;
        }
    slots:
      canvas: []
      default: []
      grid:
